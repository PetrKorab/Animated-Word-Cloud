[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AnimatedWordCloud"
version = "2.0.0"
description = "Animated version of classic word cloud for time-series text data"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
keywords = ["word cloud", "animation", "text mining", "NLP", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "pygame>=2.5.0",
    "Box2D>=2.3.10",
    "arabica==1.7.7",
    "ftfy>=6.1.1",
    "openpyxl>=3.1.5",
    "requests",
]

[project.optional-dependencies]
streamlit = ["streamlit>=1.37.0"]

[project.scripts]
animated-wordcloud-setup = "AnimatedWordCloud.downloader:main"

[project.urls]
Homepage = "https://github.com/PetrKorab/Animated-Word-Cloud"
Repository = "https://github.com/PetrKorab/Animated-Word-Cloud"

[tool.setuptools.packages.find]
where = ["."]
include = ["AnimatedWordCloud*"]
