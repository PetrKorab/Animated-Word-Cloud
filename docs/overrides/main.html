{% extends "base.html" %}

{% block scripts %}

  <style>
    #support-btn {
      position: fixed;
      bottom: 18px;
      right: 90px;
      z-index: 999;
      background: #FFDD00;
      color: #000;
      font-weight: 600;
      font-size: 14px;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;

  <script data-name="BMC-Widget"

          data-message=""
          data-color="#FFDD00"
          data-position="Right"
          data-x_margin="18"
          data-y_margin="18">
